<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHunter | Secure Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('sh_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else {
                const hour = new Date().getHours();
                const isNight = hour >= 18 || hour < 6;
                document.documentElement.setAttribute('data-theme', isNight ? 'dark' : 'light');
            }
        }
        initTheme();
    </script>

    <style>
        :root {
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --surface-color: #ffffff;
            --bg-light: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --primary-blue: #3b82f6;
            --primary-hover: #60a5fa;
            --surface-color: #1e293b;
            --bg-light: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --input-bg: #0f172a;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }

        /* ⚡ THE FIX: Force Bootstrap to use our custom Dark/Light mode colors */
        .text-muted {
            color: var(--text-muted) !important;
        }

        /* ⚡ THE FIX: Make input placeholders readable in both themes */
        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.7; /* Adds a nice subtle transparency */
        }
        
        /* Ensures the actual text you type is the correct color */
        .form-control {
            color: var(--text-main) !important;
        }

        .theme-toggle-floating {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--surface-color);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .theme-toggle-floating:hover { border-color: var(--primary-blue); transform: scale(1.05); }

        .auth-card {
            background: var(--surface-color);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .brand-text { font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); font-size: 1.75rem; }
        .brand-dot { color: var(--primary-blue); }

        .form-control {
            background: var(--input-bg);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        
        .form-control:focus {
            background: var(--surface-color);
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            color: var(--text-main);
        }

        .btn-primary-custom { background-color: var(--primary-blue); color: white; font-weight: 600; width: 100%; padding: 12px; border-radius: 8px; border: none; transition: background-color 0.2s; }
        .btn-primary-custom:hover { background-color: var(--primary-hover); }

        .switch-text { font-size: 0.9rem; color: var(--text-muted); cursor: pointer; text-align: center; display: block; margin-top: 24px; font-weight: 500; transition: color 0.2s; }
        .switch-text:hover { color: var(--primary-blue); text-decoration: underline; }
    </style>
</head>
<body>

<button class="theme-toggle-floating" onclick="toggleTheme()" title="Toggle Theme">
    <span id="themeIcon">☀️</span>
</button>

<div class="auth-card" id="authContainer">
    <div class="text-center mb-4">
        <h2 class="brand-text mb-1">SmartHunter<span class="brand-dot">.</span></h2>
        <p class="text-muted small" id="formSubtitle">Sign in to your account</p>
    </div>

    <div id="messageBox" class="alert d-none small fw-medium" role="alert"></div>

    <div id="mainForm">
        <div id="nameField" class="d-none">
            <label class="form-label small fw-semibold text-muted mb-1">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="John Doe">
        </div>

        <label class="form-label small fw-semibold text-muted mb-1">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="name@company.com">
        
        <label class="form-label small fw-semibold text-muted mb-1">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••">
        
        <button class="btn btn-primary-custom mt-2" id="actionBtn" onclick="handleAuth()">Sign In</button>
        <span class="switch-text" onclick="toggleMode()" id="toggleText">Don't have an account? Sign up</span>
    </div>

    <div id="otpForm" class="d-none">
        <div class="alert alert-info border-0 text-center small mb-4" style="background: var(--input-bg); color: var(--text-main);">
            A verification code has been sent to your email.
        </div>
        <input type="text" id="otpCode" class="form-control text-center fs-5 fw-bold tracking-widest" placeholder="000000" maxlength="6">
        <button class="btn btn-primary-custom mt-2" onclick="verifyOtp()">Verify Email</button>
    </div>
</div>

<script>
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('sh_theme', newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if(icon) icon.innerHTML = theme === 'dark' ? '☀️' : '🌙';
    }
    
    window.addEventListener('DOMContentLoaded', () => {
        updateThemeIcon(document.documentElement.getAttribute('data-theme'));
    });

    if (localStorage.getItem("hunter_user")) window.location.replace("index.html");

    let isLoginMode = true;

    // ⚡ RESTORED: Toggles the name field visibility
    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById("formSubtitle").innerText = isLoginMode ? "Sign in to your account" : "Create your account";
        document.getElementById("actionBtn").innerText = isLoginMode ? "Sign In" : "Create Account";
        document.getElementById("toggleText").innerText = isLoginMode ? "Don't have an account? Sign up" : "Already have an account? Sign in";
        
        document.getElementById("nameField").className = isLoginMode ? "d-none" : "d-block";
        hideMessage();
    }

    function showMessage(msg, isError = false) {
        const box = document.getElementById("messageBox");
        box.className = `alert ${isError ? 'alert-danger bg-danger text-white border-0' : 'alert-success bg-success text-white border-0'} small text-center mb-4`;
        box.innerText = msg;
    }

    function hideMessage() { document.getElementById("messageBox").className = "d-none"; }

    // ⚡ RESTORED: Captures the name and sends it to Java
    async function handleAuth() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const name = document.getElementById("fullName").value;
        
        if (!email || !password || (!isLoginMode && !name)) return showMessage("Please fill all fields", true);

        const endpoint = isLoginMode ? "/api/auth/login" : "/api/auth/register";
        const payload = isLoginMode ? { email, password } : { email, password, name };
        
        try {
            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            if (isLoginMode) {
                const result = await response.json();
                if (result.error) {
                    showMessage(result.error, true);
                } else {
                    showMessage("Access Granted.", false);
                    localStorage.setItem("hunter_user", result.email);
                    localStorage.setItem("hunter_name", result.name); // ⚡ Save Name!
                    setTimeout(() => window.location.replace("index.html"), 1000);
                }
            } else {
                const result = await response.text();
                if (result.includes("Error")) {
                    showMessage(result, true);
                } else {
                    document.getElementById("mainForm").classList.add("d-none");
                    document.getElementById("otpForm").classList.remove("d-none");
                    document.getElementById("formSubtitle").innerText = "Email Verification";
                }
            }
        } catch (e) { showMessage("Server connection failed.", true); }
    }

   async function verifyOtp() {
        const email = document.getElementById("email").value;
        const otp = document.getElementById("otpCode").value;
        if (!otp) return showMessage("Enter OTP", true);

        try {
            // ⚡ FIX 1: Match the exact URL from the Java Controller
            const response = await fetch("/api/auth/verify-registration", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, otp })
            });
            
            // ⚡ FIX 2: Parse as JSON because Java returns a Map<String, String>
            const result = await response.json();

            if (result.error) {
                showMessage(result.error, true);
            } else {
                showMessage(result.success + " Redirecting to login...", false);
                setTimeout(() => location.reload(), 2000);
            }
        } catch (e) { showMessage("Verification failed.", true); }
    }
</script>
</body>
</html>
