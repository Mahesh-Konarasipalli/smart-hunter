spring.application.name=job-assistant

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# ☁️ Render PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/job_assistant}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# 🧠 AI CONFIGURATION
groq.api.key=${GROQ_API_KEY:offline}

# ✉️ EMAIL CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:organization0105@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:offline}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 🌐 SERVER CONFIGURATION
server.address=0.0.0.0
server.port=${PORT:8080}