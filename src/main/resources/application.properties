spring.application.name=job-assistant

# 2. Database Config (Spring needs this to create the Hibernate beans)
# This tells Spring: "Use the Railway variable if it exists, otherwise use my local MySQL"
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_assistant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Force Hibernate to know we are using MySQL (This stops the 'Dialect' error)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={YOUR_GMAIL_ADDRESS}
spring.mail.password={YOUR_GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduled Task Settings
# Every morning at 9:00 AM
job.hunter.schedule=0 0 9 * * *
# The skill you want to hunt for automatically
job.hunter.default-skill=Java Spring Boot
# Allow larger PDF uploads for the Resume AI
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB