spring.application.name=job-assistant

# Force Hibernate to speak MySQL without needing to ping first
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Database Connection (Uses Railway variables if present, else local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_assistant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# AI Key Placeholder
groq.api.key=${GROQ_API_KEY:offline}