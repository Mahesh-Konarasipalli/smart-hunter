spring.application.name=job-assistant
# 1. LangChain4j Gemini Config (The most likely reason for the crash)
langchain4j.google-ai-gemini.chat-model.api-key={YOUR_GOOGLE_API_KEY}
langchain4j.google-ai-gemini.chat-model.model-name=gemini-2.5-flash

# 2. Database Config (Spring needs this to create the Hibernate beans)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_assistant_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Keep your existing mail, JPA, and AI settings below this...
spring.jpa.hibernate.ddl-auto=update
# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={YOUR_GMAIL_ADDRESS}
spring.mail.password={YOUR_GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Scheduled Task Settings
# Every morning at 9:00 AM
job.hunter.schedule=0 0 9 * * *
# The skill you want to hunt for automatically
job.hunter.default-skill=Java Spring Boot
# Allow larger PDF uploads for the Resume AI
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB