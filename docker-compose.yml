version: '3.8'

services:
  # 1. The MySQL Database Container
  mysql-db:
    image: mysql:8.0.33
    environment:
      MYSQL_DATABASE: job_assistant_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  smarthunter-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/job_assistant_db?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - mysql-db


volumes:
  db_data: